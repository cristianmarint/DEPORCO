version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: deporco-app:dev
    container_name: deporco-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: torneo
      DB_USERNAME: deporco
      DB_PASSWORD: deporco
      DEPORCO_AUTO_MIGRATE: "true"
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer

  db:
    image: mysql:5.7
    container_name: deporco-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: torneo
      MYSQL_USER: deporco
      MYSQL_PASSWORD: deporco
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  composer_cache:
